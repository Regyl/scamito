<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scan inventory{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site">
    <div class="wrap bar">
      <a class="brand" href="/">Scan inventory</a>
      <nav>
        <a href="/" {% if active == "overview" %}aria-current="page"{% endif %}>Overview</a>
        <a href="/hosts" {% if active == "hosts" %}aria-current="page"{% endif %}>Hosts</a>
        <a href="/cves" {% if active == "cves" %}aria-current="page"{% endif %}>CVEs</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% if db_error %}
      <p class="banner" role="alert">{{ db_error }}</p>
    {% else %}
      {% block content %}{% endblock %}
    {% endif %}
  </main>
</body>
</html>
