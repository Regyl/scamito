openapi: 3.0.3
info:
  title: FTK Backend API
  version: 1.0.0
  description: FTK Backend API documentation
paths:
  /api/articles/:
    get:
      operationId: api_articles_retrieve
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/articles/{id}/:
    get:
      operationId: api_articles_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
  /api/articles/{id}/increase-view:
    post:
      operationId: api_articles_increase_view_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/categories/:
    get:
      operationId: api_categories_retrieve
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/:
    get:
      operationId: api_documents_retrieve
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/page/{page_number}/:
    get:
      operationId: api_documents_page_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: page_number
        schema:
          type: integer
        required: true
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/filter_articles/:
    get:
      operationId: api_filter_articles_retrieve
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/reviews/:
    get:
      operationId: api_reviews_retrieve
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/special_documents/:
    get:
      operationId: api_special_documents_retrieve
      tags:
      - Admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api_main/app/add_real_estate/:
    post:
      operationId: api_main_app_add_real_estate_create
      description: 'Добавляет объект недвижимости в качестве залога к черновику заявки.
        Идентификация объекта происходит одним из трех способов: по существующему
        EID, по адресу или по кадастровому номеру.'
      summary: Добавление недвижимости к заявке
      tags:
      - Property
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealEstateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RealEstateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RealEstateRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Недвижимость успешно добавлена к заявке.
        '400':
          description: Не предоставлены валидные данные (адрес, кадастровый номер
            или EID).
        '401':
          description: Пользователь не авторизован.
        '404':
          description: Черновик заявки или объект недвижимости не найден.
  /api_main/app/add_special_equip/:
    post:
      operationId: api_main_app_add_special_equip_create
      description: Добавляет спецтехники в качестве залога к черновику заявки. Запрос
        должен быть в формате `multipart/form-data`. Идентификация происходит по EID,
        VIN-коду или путем загрузки документов (СТС, ПТС/ПСМ, ЭПТС/ЭПСМ).
      summary: Добавление спецтехники к заявке
      tags:
      - Property
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                app_eid:
                  type: string
                  format: uuid
                  description: UUID черновика заявки
                brand:
                  type: string
                  description: Марка ТС
                model:
                  type: string
                  description: Модель ТС
                prop_eid:
                  type: string
                  format: uuid
                  required: false
                  description: EID существующего ТС
                vin_code:
                  type: string
                  required: false
                  description: VIN-код ТС
                sts:
                  type: array
                  items:
                    type: string
                    format: binary
                  required: false
                  description: Фотографии СТС
                psm:
                  type: array
                  items:
                    type: string
                    format: binary
                  required: false
                  description: Фотографии ПСМ
                epsm:
                  type: string
                  format: binary
                  required: false
                  description: Файл ЭПСМ
                pdf:
                  type: string
                  format: binary
                  required: false
                  description: Готовый PDF документ
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: спецтехники успешно добавлена к заявке.
        '400':
          description: Не предоставлены валидные данные или ошибка обработки файлов.
        '401':
          description: Пользователь не авторизован.
        '404':
          description: Черновик заявки или объект не найден.
        '500':
          description: Внутренняя ошибка сервера при создании объекта.
  /api_main/app/add_vehicle/:
    post:
      operationId: api_main_app_add_vehicle_create
      description: Добавляет легкового автомобиля в качестве залога к черновику заявки.
        Запрос должен быть в формате `multipart/form-data`. Идентификация происходит
        по EID, VIN-коду или путем загрузки документов (СТС, ПТС/ПСМ, ЭПТС/ЭПСМ).
      summary: Добавление легкового автомобиля к заявке
      tags:
      - Property
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                app_eid:
                  type: string
                  format: uuid
                  description: UUID черновика заявки
                brand:
                  type: string
                  description: Марка ТС
                model:
                  type: string
                  description: Модель ТС
                prop_eid:
                  type: string
                  format: uuid
                  required: false
                  description: EID существующего ТС
                vin_code:
                  type: string
                  required: false
                  description: VIN-код ТС
                sts:
                  type: array
                  items:
                    type: string
                    format: binary
                  required: false
                  description: Фотографии СТС
                pts:
                  type: array
                  items:
                    type: string
                    format: binary
                  required: false
                  description: Фотографии ПТС
                epts:
                  type: string
                  format: binary
                  required: false
                  description: Файл ЭПТС
                pdf:
                  type: string
                  format: binary
                  required: false
                  description: Готовый PDF документ
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: легкового автомобиля успешно добавлена к заявке.
        '400':
          description: Не предоставлены валидные данные или ошибка обработки файлов.
        '401':
          description: Пользователь не авторизован.
        '404':
          description: Черновик заявки или объект не найден.
        '500':
          description: Внутренняя ошибка сервера при создании объекта.
  /api_main/app/add_video:
    post:
      operationId: api_main_app_add_video_create
      description: "\n            Добавляет или обновляет информацию о видеофайле
        в JSON-поле `video_data` черновика заявки.\n            В качестве ключа используется
        `video_type`. Если видео с таким типом уже существует, оно будет перезаписано.\n
        \           "
      summary: Добавление видео к заявке
      tags:
      - Application
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddVideoRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddVideoRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddVideoRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddVideoSuccessResponse'
          description: Видео успешно добавлено/обновлено
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddVideoBadRequestResponse'
          description: Неверный запрос (отсутствуют поля)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
          description: Пользователь не аутентифицирован
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Заявка не найдена или уже отправлена
  /api_main/app/check_attempts:
    post:
      operationId: api_main_app_check_attempts_create
      description: Возвращает текущее количество использованных попыток проверки госномера
        для активной заявки пользователя.
      summary: Проверить количество попыток
      tags:
      - GosNumber Check
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAttemptsRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckAttemptsRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckAttemptsRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptsCountResponse'
          description: Успешный ответ с количеством попыток.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Некорректный запрос (например, невалидный UUID).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Пользователь не аутентифицирован.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppNotFound'
          description: Заявка не найдена или не принадлежит пользователю.
  /api_main/app/check_gos:
    post:
      operationId: api_main_app_check_gos_create
      description: Проверяет данные автомобиля по госномеру через внешний сервис.
        Есть лимит в 3 попытки на одну заявку.
      summary: Проверить госномер
      tags:
      - GosNumber Check
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckGosNumberRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckGosNumberRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckGosNumberRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDataResponse'
          description: Успешная проверка
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка в запросе или от внешнего сервиса
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedGos'
          description: Пользователь не аутентифицирован
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppNotFoundGos'
          description: Заявка не найдена
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Лимит попыток превышен
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка внешнего сервиса
  /api_main/app/check_passport_photos:
    post:
      operationId: api_main_app_check_passport_photos_create
      description: Возвращает информацию о том, какие из трех обязательных фотографий
        паспорта (главная страница, прописка, селфи с паспортом) уже загружены. Также
        отдает текущий статус верификации пользователя.
      summary: Проверка статуса загруженных фото паспорта
      tags:
      - Passport
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckPassportResponse'
          description: Статус загруженных фотографий и верификации.
        '400':
          description: Ошибка при выполнении операции.
        '401':
          description: Пользователь не авторизован.
  /api_main/app/create_app:
    post:
      operationId: api_main_app_create_app_create
      description: Создает новую заявку или возвращает существующую незавершенную
      summary: Создание новой кредитной заявки
      tags:
      - Application
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAppRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAppRequestRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistingAppResponse'
          description: Существующая заявка найдена
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewAppResponse'
          description: Заявка успешно создана
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка в запросе
  /api_main/app/generate_qr:
    post:
      operationId: api_main_app_generate_qr_create
      description: Создает и возвращает токен, который можно использовать для авторизации
        на другом устройстве. Эндпоинт требует, чтобы пользователь был аутентифицирован.
      summary: Генерация QR-кода для входа
      tags:
      - QR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQRRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenerateQRRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateQRRequestRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCodeResponse'
          description: ''
        '401':
          description: Пользователь не авторизован
        '404':
          description: Заявка с указанным app_eid не найдена
  /api_main/app/get_loan_data:
    post:
      operationId: api_main_app_get_loan_data_create
      description: Возвращает детальную информацию по конкретной кредитной заявке
      summary: Получение данных по заявке
      tags:
      - Application
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAppDataRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetAppDataRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetAppDataRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataResponse'
          description: Данные заявки
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Не указан ID заявки
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Заявка не найдена
  /api_main/app/get_step/:
    post:
      operationId: api_main_app_get_step_create
      description: Возвращает текущий этап заполнения заявки
      summary: Получение текущего этапа заявки
      tags:
      - Application
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetStepRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetStepRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetStepRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResponse'
          description: Текущий этап
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Не указан ID заявки
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Заявка не найдена
  /api_main/app/increase_step/:
    post:
      operationId: api_main_app_increase_step_create
      description: Переводит заявку на следующий этап заполнения
      summary: Переход на следующий этап заявки
      tags:
      - Application
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncreaseStepRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IncreaseStepRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IncreaseStepRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepIncreasedResponse'
          description: Успешный переход
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Неверный запрос
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Заявка не найдена
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalErrorResponse'
          description: Ошибка при создании заявки во внешней системе
  /api_main/app/loan_name:
    put:
      operationId: api_main_app_loan_name_update
      description: Изменяет псевдоним (отображаемое имя) для текущего пользователя.
      summary: Обновление псевдонима пользователя
      tags:
      - UserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateNameRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateNameRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Имя успешно обновлено.
        '401':
          description: Пользователь не аутентифицирован.
        '404':
          description: Пользователь не найден.
  /api_main/app/qr-login:
    post:
      operationId: api_main_app_qr_login_create
      description: Обрабатывает переход по ссылке из QR-кода. Использует временный
        токен для авторизации пользователя в новой браузерной сессии.
      summary: Авторизация по QR-коду
      tags:
      - QR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRLoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRLoginRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRLoginSuccess'
          description: Успешная авторизация и переход
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRLoginError'
          description: Неверный или уже использованный токен
  /api_main/app/send_passport_verify:
    post:
      operationId: api_main_app_send_passport_verify_create
      description: Инициирует процесс верификации паспорта после того, как все три
        необходимые фотографии были загружены. Отправляет данные во внешнюю систему
        и меняет статус пользователя на 'На верификации'.
      summary: Отправка паспорта на верификацию
      tags:
      - Passport
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Паспорт успешно отправлен на верификацию.
        '400':
          description: Не все обязательные фотографии были загружены.
        '404':
          description: Данные паспорта для пользователя не найдены.
        '500':
          description: Ошибка при отправке данных во внешнюю систему.
        '401':
          description: Пользователь не авторизован.
  /api_main/app/send_popup_info:
    post:
      operationId: api_main_app_send_popup_info_create
      description: Отправляет информацию об оставленной заявке на почту менеджерам,
        не требуя авторизации
