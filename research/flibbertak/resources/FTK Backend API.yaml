      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 200
        thumbnail_img:
          type: string
          format: uri
          title: Изображение, превью
        content:
          type: string
          title: Содержание
        meta_tags:
          type: string
          title: Мета теги
        created_at:
          type: string
          format: date
          readOnly: true
          title: Дата
        views:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Просмотры
      required:
      - content
      - created_at
      - id
      - meta_tags
      - thumbnail_img
