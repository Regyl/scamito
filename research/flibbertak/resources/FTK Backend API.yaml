components:
  schemas:
    ' UnsubscribeFromMailingRequestRequest':
      type: object
      properties:
        user_id:
          type: string
          minLength: 1
      required:
      - user_id
    AddVideoBadRequestResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AddVideoRequestRequest:
      type: object
      properties:
        application_eid:
          type: string
          format: uuid
          description: UUID заявки
        video_type:
          type: string
          minLength: 1
          description: Тип видео (ключ), например 'exterior' или 'engine_sound'
        filename:
          type: string
          minLength: 1
          description: Имя файла, например 'video_123.mp4'
      required:
      - application_eid
      - filename
      - video_type
    AddVideoSuccessResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AppDataResponse:
      type: object
      properties:
        loan_amount:
          type: number
          format: double
        loan_term:
          type: integer
        legal_entity_inn:
          type: string
          nullable: true
        number:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        email_newsletter:
          type: boolean
        review_stage:
          type: string
        payment_amount:
          type: number
          format: double
          nullable: true
        reason_for_refusal:
          type: string
          nullable: true
        payment_type:
          type: string
          nullable: true
        deal_entering:
          type: string
          nullable: true
        show_contract_btn:
          type: boolean
        show_conditions:
          type: boolean
        sopd:
          type: boolean
        registration_started:
          type: boolean
        is_viewed:
          type: boolean
      required:
      - deal_entering
      - email
      - email_newsletter
      - is_viewed
      - legal_entity_inn
      - loan_amount
      - loan_term
      - name
      - number
      - payment_amount
      - payment_type
      - reason_for_refusal
      - registration_started
      - review_stage
      - show_conditions
      - show_contract_btn
      - sopd
    AppNotFound:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AppNotFoundGos:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AppealRequestRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          description: Полное имя заявителя
        phone:
          type: string
          minLength: 1
          description: Контактный телефон
        comment:
          type: string
          description: Текст обращения
        postal_address:
          type: string
          description: Почтовый адрес
        email_address:
          description: Email адрес
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        contract_number:
          type: string
          description: Номер договора
        sent_on_behalf_of:
          type: boolean
          description: Отправлено от вашего имени? (true/false)
        appeal_decision:
          type: boolean
          description: Обжалование решения? (true/false)
        appeal_type:
          type: string
          description: Тип обращения
        response_method:
          type: boolean
          description: Способ получения ответа (true - электронный, false - почтой)
        attached_file:
          type: string
          format: binary
          description: Прикрепляемый файл (максимальный размер 10 МБ)
      required:
      - full_name
      - phone
    AppealServerErrorResponse:
      type: object
      properties:
        message:
          type: string
        send_status:
          type: boolean
      required:
      - message
      - send_status
    AppealSuccessResponse:
      type: object
      properties:
        message:
          type: string
        send_status:
          type: boolean
      required:
      - message
      - send_status
    AppealValidationResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    ApplicationItem:
      type: object
      properties:
        eid:
          type: string
          format: uuid
          description: Уникальный идентификатор заявки
        number:
          type: string
          description: Номер заявки
        review_stage:
          allOf:
          - $ref: '#/components/schemas/ReviewStageEnum'
          description: |-
            Статус рассмотрения заявки

            * `Заполнение` - Filling
            * `На рассмотрении` - Consideration
            * `Одобрено` - Approved
            * `Закрыта` - Not Relevant
        created_at:
          type: string
          format: date-time
          description: Дата и время создания
      required:
      - created_at
      - eid
      - number
      - review_stage
